<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc"><meta name="description" content="TeeXaa — ترمینال هوشمند بازار و دارایی">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo-app.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><title>TeeXaa®</title>
</head><body>
<div id="splash" class="splash">
  <div class="s-ambient ambient-a"></div><div class="s-ambient ambient-b"></div><div class="s-ambient ambient-c"></div>
  <div class="s-stars"></div>
  <div class="s-orbit-scene" aria-hidden="true">
    <div class="orbit-halo halo-1"></div><div class="orbit-halo halo-2"></div>
    <svg class="orbit-svg" viewBox="0 0 520 520" role="img" aria-label="TeeXaa">
      <defs>
        <linearGradient id="blueA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071f67"/><stop offset=".42" stop-color="#075eff"/><stop offset=".72" stop-color="#12c9ff"/><stop offset="1" stop-color="#7fdfff"/></linearGradient>
        <linearGradient id="blueB" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#0a3dba"/><stop offset=".55" stop-color="#08a8ff"/><stop offset="1" stop-color="#b8efff"/></linearGradient>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g class="orbit-core" filter="url(#glow)">
        <ellipse class="ring ring-1" cx="260" cy="260" rx="178" ry="72" transform="rotate(-32 260 260)"/>
        <ellipse class="ring ring-2" cx="260" cy="260" rx="178" ry="72" transform="rotate(2 260 260)"/>
        <ellipse class="ring ring-3" cx="260" cy="260" rx="178" ry="72" transform="rotate(36 260 260)"/>
      </g>
      <g class="orbit-particles"><circle cx="102" cy="182" r="3.5"/><circle cx="407" cy="321" r="3"/><circle cx="355" cy="123" r="2.5"/><circle cx="145" cy="397" r="2.5"/></g>
    </svg>
    <div class="orbit-flare flare-a"></div><div class="orbit-flare flare-b"></div>
  </div>
  <div class="entry-brand">
    <div class="entry-wordmark" aria-label="TeeXaa"><span class="tw t1">T</span><span class="tw e1">e</span><span class="tw e2">e</span><span class="tw x">X</span><span class="tw a1">a</span><span class="tw a2">a</span><sup>®</sup></div>
    <div class="entry-caption">به دنیای فرصت‌ها قدم بگذار</div>
  </div>
  <div class="s-loader"><span></span></div>
  <div class="s-bottom"><span>TEEXAA</span><span id="bootPct">00%</span></div>
</div>
<div id="app" class="hidden">
<header class="mobile-head"><button class="brand-mini" data-page="home"><img src="logo-app.png"><span>TeeXaa<sup>®</sup></span></button><div class="head-actions"><button class="round-btn" data-page="notifications" aria-label="اعلان">${''}<span class="i-bell"></span><em></em></button><button class="profile-dot" data-page="profile">T</button></div></header>
<div class="layout">
<aside class="rail"><div class="rail-brand"><img src="logo-app.png"><div><b>TeeXaa<sup>®</sup></b><small>MARKET TERMINAL</small></div></div><div class="rail-status"><span></span>داده‌ها متصل</div><nav id="railNav"></nav><div class="rail-foot"><button data-page="security"><span class="i-lock"></span><b>امنیت</b></button><div class="rail-user"><span>T</span><div><b>حساب TeeXaa</b><small>Standard</small></div></div></div></aside>
<main id="view"></main></div>
<nav class="bottom-nav" id="bottomNav"></nav></div>
<div id="toast" class="toast"></div><div id="modal" class="modal"></div>
<script src="app.js"></script></body></html>
